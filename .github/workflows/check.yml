name: check

on:
  push:
    branches:
      - master
      - main   
  pull_request:

jobs:
  check:
    strategy:    
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all

      - name: moon check
        run: |
          moon update
          moon check --deny-warn

      - name: moon info
        run: |
          moon info
          git diff --exit-code

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: moon test
        run: |
          moon test --target all

      - name: mooncram jq
        working-directory: cmd/jq
        run: |
          moonx moonbit-community/mooncram@0.1.0 test ../../tests/cram/cli.md ../../TUTORIAL.md --target wasm
          moonx moonbit-community/mooncram@0.1.0 test ../../tests/cram/cli.md ../../TUTORIAL.md --target native

      - name: mooncram jqlog
        working-directory: cmd/jqlog
        run: |
          moonx moonbit-community/mooncram@0.1.0 test ../../tests/cram/jqlog.md --target wasm
          moonx moonbit-community/mooncram@0.1.0 test ../../tests/cram/jqlog.md --target native
