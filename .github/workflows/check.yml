name: check

on:
  push:
    branches:
      - master
      - main   
  pull_request:

jobs:
  check:
    strategy:    
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all

      - name: install moon-cram
        run: |
          curl -fsSL https://github.com/moonbitlang/moon-cram/releases/download/v0.0.1/moon-cram-v0.0.1-linux-x86_64.tar.gz -o moon-cram.tar.gz
          tar -xzf moon-cram.tar.gz
          install -m 0755 moon-cram-linux-x86_64/moon-cram "$HOME/.moon/bin/moon-cram"
          moon-cram --version

      - name: moon check
        run: |
          moon update
          moon check --deny-warn

      - name: moon info
        run: |
          moon info
          git diff --exit-code

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: moon test
        run: |
          moon test --target all

      - name: moon cram cli
        run: |
          moon run --target native scripts/check_cram_cli.mbtx
